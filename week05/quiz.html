<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/quiz.css">
    <title>HTML & CSS Quiz</title>
</head>

<body>

    <main class="box">
        <h1>✅ Basic HTML and CSS Quiz </h1>
        <form class="box">
            <div class="quiz-item box">
                <label for="q1">1. What does CSS stand for?
                    <input type="text" id="q1" name="q1" required></label>
            </div>
            <div class="quiz-item box">
                <label for="q2">2. How are the id and class attributes selected in CSS? </label>
                <textarea id="q2" name="q2"></textarea>
            </div>
            <div class="quiz-item box">
                <label for="q3">3. Which of the following is a valide CSS comment? </label>
                <select id="q3" name="q3">
                    <option value="" selected disabled> Choose One...</option>></option>
                    <option value="a">A &lt;!-- This is a comment --&gt;</option>
                    <option value="b">B /* This is a comment */</option>
                    <option value="c">C. // THis is a comment</option>
                </select>
            </div>
            <div class="quiz-item box">
                <label for="q4">4. What is the bottome margin given the declaration? </label>
                <code class="box">margin: 10px 5px 15px;</code>
                <input type="number" id="q4" name="q4">
            </div>
            <button type="submit">Submit Quiz</button>
        </form>
    </main>

</body>

</html>

<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact The Rafting Company for white water rafting trips, bookings, and inquiries. Get in touch with Ueta Utai for more information.">
    <meta name="author" content="Ueta Sam Utai">
    <title>Contact Us - The Rafting Company</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>


    <header>
        <img src="images/rafting-logo.jpg" alt="Rafting Logo" width="200">
        <div></div>
        <nav class="ul">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="contact-info">
            <h1>White Water Rafting Company</h1>
            <p>
                123 Main River Street<br>
                Kolob, California<br>
                +1 999 999 9999<br>
                info@whitewater.com
            </p>
        </section>


        <section class="contact-layout">

            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d225953.45990113448!2d152.8801076678679!3d-27.762860798485136!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1slogan!5e0!3m2!1sen!2sus!4v1785837755322!5m2!1sen!2sus"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin">
                </iframe>
            </div>


            <form class="contact-form" action="#" method="get">
                <div class="form-row">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your full name" required>
                </div>

                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com"
                      required>
                </div>

                <div class="form-row purpose-row">
                    <label>Message<br>Purpose</label>
                    <div class="radio-group">
                        <label for="purpose-general">
                            <input type="radio" id="purpose-general" name="purpose" value="general"
                              checked>
                            General Inquiry
                        </label>
                        <label for="purpose-reservation">
                            <input type="radio" id="purpose-reservation" name="purpose"
                              value="reservation">
                            Reservation Question
                        </label>
                        <label for="purpose-suggestion">
                            <input type="radio" id="purpose-suggestion" name="purpose"
                              value="suggestion">
                            Website Suggestion
                        </label>
                    </div>
                </div>

                <div class="form-row">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5"
                      placeholder="Type your message here..." required></textarea>
                </div>

                <div class="checkbox-row">
                    <label for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                        Please Subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit">Submission</button>
            </form>
        </section>


        <section class="serve">
            <h2>We Are Here to Serve You</h2>
            <div class="employees">
                <figure>
                    <img src="images/profile-1.jpg" alt="Employee Profile">
                    <figcaption>River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/profile-2.jpg" alt="Employee Profile">
                    <figcaption>Safety Officer</figcaption>
                </figure>
                <figure>
                    <img src="images/profile-3.jpg" alt="Employee Profile">
                    <figcaption>Trip Coordinator</figcaption>
                </figure>
            </div>
        </section>
    </main>


    <footer>
        <p class="p1">&copy;2026, The Rafting Company, Ueta Utai</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Logo" width="50">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram Logo" width="50">
            </a>
            <a href="https://x.com">
                <img src="images/twitter.png" alt="X Logo" width="50">
            </a>
        </nav>
    </footer>

</body>

</html>
